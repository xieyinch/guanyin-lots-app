name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci

      - name: Generate Android project
        run: |
          npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_ROOT: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0
          cmdline-tools-version: 11.0

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## 🎉 观音灵签 APK 发布
          
          ### 更新内容
          EOF
          git log -5 --pretty=format:"- %s" >> release-notes.md
          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "### 安装说明" >> release-notes.md
          echo "1. 下载 APK 文件" >> release-notes.md
          echo "2. 允许安装未知来源应用" >> release-notes.md
          echo "3. 安装并打开应用" >> release-notes.md
          echo "" >> release-notes.md
          echo "**构建时间**: $(date '+%Y-%m-%d %H:%M')" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
