name: Build Android APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npx expo prebuild --platform android --clean
      
      - name: Build APK
        id: build
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          echo "Looking for APK..."
          find app/build -name "*.apk"
          APK_PATH=$(find app/build -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" /tmp/app-debug.apk
            echo "apk_path=/tmp/app-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "APK not found!"
            exit 1
          fi
      
      - uses: actions/upload-artifact@v4
        with:
          name: guanyin-lots.apk
          path: /tmp/app-debug.apk
      
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: /tmp/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
