name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build APK in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: reactnativecommunity/react-native-android:react-native-0.81
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            echo "🔧 Installing dependencies..."
            npm install --legacy-peer-deps
            
            echo "📱 Prebuilding Android project..."
            npx expo prebuild --platform android --clean
            
            echo "🏗️ Building APK..."
            cd android
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon
            
            echo "📦 Finding APK..."
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
            if [ -z "$APK_FILE" ]; then
              echo "❌ APK not found!"
              exit 1
            fi
            
            echo "✅ APK built: $APK_FILE"
            cp $APK_FILE /tmp/guanyin-lots-app-debug.apk
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guanyin-lots-app-debug.apk
          path: /tmp/guanyin-lots-app-debug.apk
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: /tmp/guanyin-lots-app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
