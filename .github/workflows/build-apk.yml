name: Build Android APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        id: setup-android
        with:
          api-level: 36
          build-tools-version: 36.0.0
      
      - name: Build APK
        id: build
        working-directory: android
        run: |
          echo "sdk.dir=${{ steps.setup-android.outputs.sdk-path }}" > local.properties
          cat local.properties
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk ../guanyin-lots.apk
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: guanyin-lots-debug.apk
          path: guanyin-lots.apk
      
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: guanyin-lots.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
