name: Build Android APK

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npx expo prebuild --platform android --clean
      
      - name: Build APK
        id: build
        working-directory: android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Built: $APK"
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: /tmp/build.log
      
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.apk_path != ''
        with:
          name: guanyin-lots.apk
          path: ${{ steps.build.outputs.apk_path }}
      
      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && steps.build.outputs.apk_path != ''
        with:
          files: ${{ steps.build.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
