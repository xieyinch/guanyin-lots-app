name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      - name: Build Debug APK
        id: build_apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "apk_path=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)" >> $GITHUB_OUTPUT
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guanyin-lots-app-debug.apk
          path: ${{ steps.build_apk.outputs.apk_path }}
          retention-days: 14

      - name: Create Release (if tag)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            ## 🎉 观音灵签 APK 发布
            
            ### 版本信息
            - 标签：${{ github.ref_name }}
            - 提交：${{ github.sha }}
            - 构建时间：$(date '+%Y-%m-%d %H:%M')
            
            ### 安装说明
            1. 下载 APK 文件
            2. 在 Android 设置中允许"安装未知来源应用"
            3. 安装并打开应用
            
            ### 注意事项
            - 这是 Debug 版本，体积较大
            - 仅供测试使用
          files: ${{ steps.build_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
